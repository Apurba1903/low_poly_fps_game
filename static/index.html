<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FPS Clash</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --a: #ff5c5c; --b: #4da3ff; --ink: #e8ecf1; --dim: #9aa4b2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e13; color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #join { position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 50% 30%, #1a2230, #0b0e13); z-index: 10; }
  .card { width: min(380px, 92vw); background: #121824; border: 1px solid #243043; border-radius: 14px;
    padding: 28px 28px 22px; box-shadow: 0 20px 60px #0008; }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: 1px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  label { display: block; color: var(--dim); font-size: 13px; margin: 14px 0 6px; }
  input[type=text] { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #2c394f;
    background: #0d1219; color: var(--ink); font-size: 16px; outline: none; }
  input[type=text]:focus { border-color: #4a6a99; }
  .teams { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .teams button { padding: 10px 0; border-radius: 8px; border: 2px solid #2c394f; background: #0d1219;
    color: var(--ink); cursor: pointer; font-weight: 600; }
  .teams button.sel[data-team="A"] { border-color: var(--a); color: var(--a); }
  .teams button.sel[data-team="B"] { border-color: var(--b); color: var(--b); }
  .teams button.sel[data-team="auto"] { border-color: #8be0a4; color: #8be0a4; }
  #go { margin-top: 20px; width: 100%; padding: 13px; border: 0; border-radius: 10px;
    background: linear-gradient(135deg, #ffb23f, #ff6a3d); color: #1a1208; font-weight: 800; font-size: 16px;
    cursor: pointer; letter-spacing: .5px; }
  #go:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 14px; text-align: center; }
  #err { color: #ff8585; min-height: 18px; font-size: 13px; margin-top: 8px; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud.on { display: block; }
  #cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%); }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #cross::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #cross::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #cross.hit::before, #cross.hit::after { background: #ff4040; }
  #top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;
    align-items: center; font-weight: 800; font-size: 22px; background: #0008; padding: 6px 16px; border-radius: 10px; }
  #top .A { color: var(--a); } #top .B { color: var(--b); } #timer { font-variant-numeric: tabular-nums; }
  #bottom-left { position: absolute; left: 20px; bottom: 20px; width: 240px; }
  #hpbar { height: 10px; background: #0008; border-radius: 6px; overflow: hidden; }
  #hpfill { height: 100%; width: 100%; background: #6ddc6d; transition: width .1s; }
  #hptext { font-weight: 800; font-size: 26px; text-shadow: 0 1px 3px #000; }
  #ammo { position: absolute; right: 24px; bottom: 20px; font-weight: 800; font-size: 34px; text-shadow: 0 1px 3px #000;
    font-variant-numeric: tabular-nums; }
  #ammo small { font-size: 16px; color: var(--dim); }
  #topright { position: absolute; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  #board { width: 230px; background: #0009; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  #board .team { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; margin-top: 6px; padding: 2px 0; border-bottom: 1px solid #fff2; }
  #board .team:first-child { margin-top: 0; }
  #board .team.A { color: var(--a); } #board .team.B { color: var(--b); }
  #board .team small { color: var(--dim); font-weight: 600; font-size: 11px; margin-left: 6px; }
  #board .pl { display: flex; justify-content: space-between; padding: 1px 0; color: var(--ink); }
  #board .pl.me { font-weight: 800; }
  #board .pl span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; }
  #board .empty { color: var(--dim); font-style: italic; }
  #feed { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  #feed div { background: #0009; padding: 4px 10px; border-radius: 6px; font-size: 13px; }
  #feed .A { color: var(--a); font-weight: 700; } #feed .B { color: var(--b); font-weight: 700; }
  #banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); text-align: center; }
  #banner h2 { margin: 0; font-size: 42px; text-shadow: 0 2px 10px #000; }
  #banner p { margin: 6px 0 0; color: var(--dim); font-size: 16px; }
  #vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px #e00; opacity: 0; transition: opacity .25s; }
  #healfx { position: absolute; inset: 0; box-shadow: inset 0 0 180px #2f2; opacity: 0; transition: opacity .4s; }
  #dmgdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .arrow { position: absolute; left: -6px; top: -90px; width: 0; height: 0; border-left: 6px solid transparent;
    border-right: 6px solid transparent; border-bottom: 14px solid #f33; transform-origin: 6px 90px; opacity: .9;
    animation: fade .8s forwards; }
  @keyframes fade { to { opacity: 0; } }
  #score { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #0d1219ee;
    border: 1px solid #2c394f; border-radius: 12px; padding: 16px 22px; display: none; min-width: 460px; }
  #score.on { display: block; }
  #score table { border-collapse: collapse; width: 100%; }
  #score th { text-align: left; color: var(--dim); font-weight: 600; font-size: 12px; padding: 4px 8px; }
  #score td { padding: 4px 8px; }
  #score .A td:first-child { color: var(--a); } #score .B td:first-child { color: var(--b); }
  #lobbybar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0009; padding: 8px 14px;
    border-radius: 10px; pointer-events: auto; display: none; gap: 10px; align-items: center; font-size: 13px; }
  #lobbybar.on { display: flex; }
  #lobbybar button { border: 1px solid #2c394f; background: #121824; color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #clickhint { position: absolute; inset: 0; display: grid; place-items: center; background: #0008; font-size: 20px; font-weight: 700; pointer-events: auto; cursor: pointer; }
  #clickhint.hidden { display: none; }
  #minimap { position: absolute; left: 14px; top: 14px; border: 1px solid #2c394f; border-radius: 8px; opacity: .9; }
</style>
</head>
<body>
<div id="join">
  <div class="card">
    <h1>FPS CLASH</h1>
    <p class="sub">LAN first-person shooter. Keyboard + mouse required.</p>
    <label for="name">Your name</label>
    <input id="name" type="text" maxlength="16" placeholder="e.g. Apurba" autocomplete="off">
    <label>Team</label>
    <div class="teams">
      <button data-team="A">TEAM A</button>
      <button data-team="auto" class="sel">AUTO</button>
      <button data-team="B">TEAM B</button>
    </div>
    <button id="go">JOIN GAME</button>
    <div id="err"></div>
    <div class="hint">WASD move · Mouse aim · Click shoot · R reload · Shift sprint · Space jump · C crouch · 1/2/Q/wheel rifle↔knife · Tab scoreboard</div>
  </div>
</div>

<div id="hud">
  <div id="vignette"></div>
  <div id="healfx"></div>
  <div id="dmgdir"></div>
  <div id="cross"></div>
  <canvas id="minimap"></canvas>
  <div id="top"><span class="A" id="sA">0</span><span id="timer">5:00</span><span class="B" id="sB">0</span></div>
  <div id="topright"><div id="board"></div><div id="feed"></div></div>
  <div id="banner"></div>
  <div id="bottom-left"><div id="hptext">100</div><div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="ammo">30 <small>/ 30</small></div>
  <div id="score"><table><thead><tr><th>Player</th><th>Team</th><th>K</th><th>D</th></tr></thead><tbody></tbody></table></div>
  <div id="lobbybar"><span>Waiting for the admin to start · switch team:</span><button data-team="A">A</button><button data-team="B">B</button></div>
  <div id="clickhint" class="hidden">Click to capture the mouse</div>
</div>

<script type="importmap">
{ "imports": { "three": "/static/three.module.min.js" } }
</script>
<script type="module" src="/static/game.js"></script>
</body>
</html>
